name: Bug
description: Something is not working as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you see, and what did you expect?
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Firefox
        - Edge
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: "1.1.0"
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Page type (Home, Subscriptions, Search, watch sidebar, Shorts) and the steps.
    validations:
      required: true
